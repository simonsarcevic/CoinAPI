name: CoinSystem
version: 2.0
author: EinKaktus
main: de.einkaktus.coins.Main
depend: [Vault]
load: STARTUP

commands:
  eco:
    description: Verwaltet die Kontostände der Spieler.
    usage: /eco <give|take|set|reset> <Spieler> [Betrag]
  balance:
    aliases: [bal]
    description: Zeigt einen Kontostand an.
    usage: /balance [Spieler]
  pay:
    description: Überweist Coins an einen Spieler.
    usage: /pay <Spieler> <Betrag>
  baltop:
    description: Zeigt die reichsten Spieler an.
    usage: /baltop

permissions:
  coinsystem.admin:
    description: Gewährt Zugriff auf alle CoinSystem-Befehle.
    default: op
    children:
      coinsystem.eco.give: true
      coinsystem.eco.take: true
      coinsystem.eco.set: true
      coinsystem.eco.reset: true
      coinsystem.balance: true
      coinsystem.balance.others: true
      coinsystem.pay: true
      coinsystem.baltop: true
  coinsystem.eco.give:
    description: Erlaubt /eco give.
    default: op
  coinsystem.eco.take:
    description: Erlaubt /eco take.
    default: op
  coinsystem.eco.set:
    description: Erlaubt /eco set.
    default: op
  coinsystem.eco.reset:
    description: Erlaubt /eco reset.
    default: op
  coinsystem.balance:
    description: Erlaubt das Anzeigen des eigenen Kontostands.
    default: true
  coinsystem.balance.others:
    description: Erlaubt das Anzeigen fremder Kontostände.
    default: op
  coinsystem.pay:
    description: Erlaubt Überweisungen an andere Spieler.
    default: true
  coinsystem.baltop:
    description: Erlaubt das Anzeigen der Geld-Rangliste.
    default: true
